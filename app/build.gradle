plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.codelab.futbot'
    compileSdk 34
    defaultConfig { applicationId 'com.futbot.control'; minSdk 24; targetSdk 34; versionCode 2; versionName '2.0' }
    signingConfigs {
        fixed { storeFile file('futbot.keystore'); storePassword 'futbot123'; keyAlias 'futbot'; keyPassword 'futbot123' }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release { signingConfig signingConfigs.fixed }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
